<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Safe Steer — Forgot Password</title>

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <div class="bg"></div>

  <header class="glass-nav">
    <div class="logo">Safe Steer</div>
    <nav>
      <a href="{{ url_for('index') }}">Login</a>
    </nav>
  </header>

  <main class="center">
    <div class="glass-card">
      <div class="panel wide">
        <h2>Forgot Password</h2>
        {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
        {% if message %}<p style="color:limegreen">{{ message }}</p>{% endif %}

        <form method="post" action="{{ url_for('forgot') }}" class="form">
          <div class="input-row">
            <input type="email" name="email" placeholder="Enter your email" required />
            <i class='bx bx-envelope'></i>
          </div>
          <button type="submit" class="btn primary">Reset Password</button>
        </form>

        <p class="swap">
          Remember your password?
          <a href="{{ url_for('index') }}">Back to Login</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
